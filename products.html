<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog | Scopus Agrosolutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#16a34a',
                        secondary: '#2563eb',
                        accent: '#facc15',
                        danger: '#dc2626',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .hamburger-line { display: block; width: 24px; height: 2px; background: currentColor; transition: all 0.3s ease; transform-origin: center; }
        .menu-open .hamburger-line:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .menu-open .hamburger-line:nth-child(2) { opacity: 0; transform: scaleX(0); }
        .menu-open .hamburger-line:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        #mobile-menu { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #mobile-menu.menu-open { max-height: 400px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-gray-900 text-slate-800 dark:text-gray-100 transition-colors duration-300">
    <div class="bg-primary text-white text-[10px] sm:text-xs py-2 px-6 flex justify-between items-center font-semibold">
        <div class="flex items-center gap-4">
            <span class="hidden sm:inline">Delivering Countrywide</span>
            <span>Support: +254715081336</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="bg-white/20 px-2 py-0.5 rounded">B2B Focused</span>
        </div>
    </div>

    <nav class="sticky top-0 z-50 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md shadow-sm border-b dark:border-gray-700">
        <div class="px-4 sm:px-6 py-3 sm:py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 sm:gap-3">
                <div class="w-9 h-9 sm:w-12 sm:h-12 bg-primary rounded-xl flex items-center justify-center text-white font-black text-lg sm:text-2xl shadow-lg rotate-3 flex-shrink-0">SA</div>
                <div>
                    <h1 class="text-base sm:text-xl font-bold leading-none text-primary uppercase tracking-tight">Scopus</h1>
                    <span class="text-[8px] sm:text-[9px] font-bold text-secondary tracking-[0.2em] uppercase">Agrosolutions</span>
                </div>
            </div>

            <div class="hidden lg:flex gap-8 text-sm font-bold uppercase tracking-wider">
                <a href="/" class="hover:text-primary transition">Home</a>
                <a href="products.html" class="text-primary transition">Products</a>
                <a href="about.html" class="hover:text-primary transition">About</a>
                <a href="contact.html" class="hover:text-primary transition">Contact</a>
            </div>

            <div class="flex items-center gap-1 sm:gap-3">
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <svg class="w-5 h-5 dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
                </button>
                <button onclick="toggleCart()" class="relative p-2 text-gray-700 dark:text-gray-300 hover:text-primary transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="cart-count" class="absolute top-0 right-0 bg-danger text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center border-2 border-white dark:border-gray-800">0</span>
                </button>
                <button id="hamburger-btn" class="lg:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition flex flex-col gap-1.5 items-center justify-center">
                    <span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="lg:hidden bg-white dark:bg-gray-800 border-t dark:border-gray-700">
            <div class="px-4 py-4 flex flex-col gap-1">
                <a href="index.html" class="px-4 py-3 rounded-xl font-bold uppercase text-sm hover:bg-primary/10">Home</a>
                <a href="products.html" class="px-4 py-3 rounded-xl font-bold uppercase text-sm hover:bg-primary/10 text-primary">Products</a>
                 <a href="about.html" class="px-4 py-3 rounded-xl font-bold uppercase text-sm hover:bg-primary/10 text-primary">About</a>
                  <a href="contact.html" class="px-4 py-3 rounded-xl font-bold uppercase text-sm hover:bg-primary/10 text-primary">Contact</a>
            </div>
        </div>
    </nav>

    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 py-12 px-6">
        <div class="max-w-7xl mx-auto">
            <nav class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 flex gap-2">
                <span>Home</span> <span>/</span> <span class="text-primary">Catalog</span>
            </nav>
            <h2 class="text-4xl font-black">Professional <span class="text-primary">Catalog</span></h2>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-12 flex flex-col lg:flex-row gap-12">
        <aside class="w-full lg:w-64 space-y-8">
            <div>
                <h4 class="text-xs font-black uppercase tracking-[0.2em] mb-4 text-gray-400">Search</h4>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Search product..." class="w-full bg-white dark:bg-gray-800 border dark:border-gray-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-primary outline-none">
            </div>
            <div>
                <h4 class="text-xs font-black uppercase tracking-[0.2em] mb-4 text-gray-400">Categories</h4>
                <div class="space-y-2">
                    <button onclick="setCategory('All')" class="w-full text-left px-4 py-2 rounded-lg text-sm font-bold transition hover:bg-primary/10 category-btn" data-cat="All">All Items</button>
                    <button onclick="setCategory('Fertilizer')" class="w-full text-left px-4 py-2 rounded-lg text-sm font-bold transition hover:bg-primary/10 category-btn" data-cat="Fertilizer">Foliar Fertilizers</button>
                </div>
            </div>
        </aside>

        <div class="flex-grow">
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8"></div>
        </div>
    </div>

    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-[400px] bg-white dark:bg-gray-900 shadow-2xl z-[100] transform translate-x-full transition-transform duration-500 border-l dark:border-gray-700">
        <div class="p-8 h-full flex flex-col">
            <div class="flex justify-between items-center mb-10">
                <h3 class="text-2xl font-black">My Order</h3>
                <button onclick="toggleCart()" class="text-2xl hover:text-danger">&times;</button>
            </div>
            <div id="cart-items" class="flex-grow overflow-y-auto space-y-4 custom-scrollbar"></div>
            <div class="mt-8 pt-8 border-t dark:border-gray-800">
                <div class="flex justify-between text-2xl font-black mb-6">
                    <span>Total</span>
                    <span id="cart-total" class="text-primary">KES 0</span>
                </div>
                <button onclick="sendWhatsAppOrder()" class="w-full bg-[#25D366] text-white py-4 rounded-xl font-black uppercase tracking-widest hover:bg-[#128C7E] transition shadow-lg flex items-center justify-center gap-2">
                    Order via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        const ownerPhone = "254715081336";
        
        // Product data with your specific pricing
        const products = [
            { 
                id: 1, 
                name: "Omnigrow 25", 
                category: "Fertilizer",
                prices: { "250ml": 300, "500ml": 500, "1L": 850, "5L": 3500, "10L": 6800, "20L": 13000 },
                img: "images/omnigrow.jpeg"
            },
            { 
                id: 2, 
                name: "Rootstart 52", 
                category: "Fertilizer",
                prices: { "250ml": 300, "500ml": 500, "1L": 850, "5L": 3500, "10L": 6800, "20L": 13000 },
                img: "images/rootstart.jpeg"
            },
            { 
                id: 3, 
                name: "Fruitmax 46", 
                category: "Fertilizer",
                prices: { "250ml": 300, "500ml": 500, "1L": 850, "5L": 3500, "10L": 6800, "20L": 13000 },
                img: "images/fruitmax42.jpeg"
            },
            { 
                id: 4, 
                name: "CalMag Plus", 
                category: "Fertilizer",
                prices: { "250ml": 300, "500ml": 500, "1L": 850, "5L": 3500, "10L": 6800, "20L": 13000 },
                img: "images/calmag.jpeg"
            }
        ];

        let currentCategory = "All";
        let cart = JSON.parse(localStorage.getItem('scopus_cart_v2')) || [];

        function init() {
            filterProducts();
            updateCartUI();
            setupTheme();
        }

        function filterProducts() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchesCat = currentCategory === "All" || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchTerm);
                return matchesCat && matchesSearch;
            });
            renderGrid(filtered);
        }

        function updateDisplayPrice(productId) {
            const product = products.find(p => p.id === productId);
            const size = document.getElementById(`size-${productId}`).value;
            const priceLabel = document.getElementById(`price-display-${productId}`);
            priceLabel.innerText = `KES ${product.prices[size].toLocaleString()}`;
        }

        function renderGrid(list) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = list.map(p => {
                const sizes = Object.keys(p.prices);
                return `
                <div class="bg-white dark:bg-gray-800 rounded-3xl overflow-hidden shadow-sm border dark:border-gray-700 hover:shadow-xl transition group">
                    <div class="h-48 overflow-hidden bg-gray-100 dark:bg-gray-900">
                        <img src="${p.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    </div>
                    <div class="p-6">
                        <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">${p.category}</span>
                        <h4 class="font-bold text-lg mb-4">${p.name}</h4>
                        <div class="flex justify-between items-center mb-6">
                            <span id="price-display-${p.id}" class="text-primary font-black">KES ${p.prices[sizes[0]].toLocaleString()}</span>
                            <select id="size-${p.id}" onchange="updateDisplayPrice(${p.id})" class="bg-gray-50 dark:bg-gray-900 border-none text-[10px] font-bold rounded-lg p-1 px-2 outline-none">
                                ${sizes.map(s => `<option value="${s}">${s}</option>`).join('')}
                            </select>
                        </div>
                        <button onclick="addToCart(${p.id}, event)" class="w-full bg-primary text-white py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-green-700 transition">
                            Add to Cart
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        function addToCart(productId, event) {
            const product = products.find(p => p.id === productId);
            const size = document.getElementById(`size-${productId}`).value;
            const price = product.prices[size];
            
            cart.push({ ...product, selectedSize: size, currentPrice: price, cartId: Date.now() });
            localStorage.setItem('scopus_cart_v2', JSON.stringify(cart));
            updateCartUI();
            
            event.target.innerText = "Added ✓";
            setTimeout(() => event.target.innerText = "Add to Order", 1000);
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            localStorage.setItem('scopus_cart_v2', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            document.getElementById('cart-count').innerText = cart.length;
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center py-10 opacity-30 text-xs font-bold uppercase">Empty</p>`;
                document.getElementById('cart-total').innerText = "KES 0";
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="flex gap-4 bg-gray-50 dark:bg-gray-800 p-4 rounded-2xl relative">
                        <img src="${item.img}" class="w-16 h-16 object-cover rounded-lg">
                        <div>
                            <p class="font-bold text-sm">${item.name}</p>
                            <p class="text-[10px] font-bold text-primary uppercase">${item.selectedSize}</p>
                            <p class="font-bold text-sm mt-1">KES ${item.currentPrice.toLocaleString()}</p>
                        </div>
                        <button onclick="removeFromCart(${item.cartId})" class="absolute top-2 right-2 text-gray-300 hover:text-danger">&times;</button>
                    </div>
                `).join('');
                const sum = cart.reduce((acc, item) => acc + item.currentPrice, 0);
                document.getElementById('cart-total').innerText = `KES ${sum.toLocaleString()}`;
            }
        }

        function sendWhatsAppOrder() {
            if(cart.length === 0) return alert("Cart is empty");
            let message = `*NEW ORDER - SCOPUS AGROSOLUTIONS*%0A%0A`;
            cart.forEach((item, i) => message += `${i+1}. ${item.name} (${item.selectedSize}) - KES ${item.currentPrice.toLocaleString()}%0A`);
            const sum = cart.reduce((acc, item) => acc + item.currentPrice, 0);
            message += `%0A*TOTAL: KES ${sum.toLocaleString()}*`;
            window.open(`https://wa.me/${ownerPhone}?text=${message}`, '_blank');
        }

        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('translate-x-full'); }
        function setCategory(cat) { currentCategory = cat; filterProducts(); }
        
        function setupTheme() {
            const themeBtn = document.getElementById('theme-toggle');
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            themeBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            });
        }

        const hamburgerBtn = document.getElementById('hamburger-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        hamburgerBtn.addEventListener('click', () => {
            const isOpen = mobileMenu.classList.toggle('menu-open');
            hamburgerBtn.classList.toggle('menu-open', isOpen);
        });

        init();
    </script>
</body>
</html>
